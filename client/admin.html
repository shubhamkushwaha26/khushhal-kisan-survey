<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khushhal Kisan | Admin Panel</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#203326;background:#f3f6f1}*{box-sizing:border-box}body{margin:0}header{background:#174d32;color:#fff;padding:20px max(18px,calc((100% - 1180px)/2))}main{max-width:1240px;margin:28px auto;padding:0 18px}.card{background:#fff;border:1px solid #e7eee8;border-radius:16px;padding:24px;margin-bottom:18px;box-shadow:0 8px 28px #183b250b}.hidden{display:none!important}input{display:block;width:100%;max-width:420px;padding:13px;margin:12px 0;border:1px solid #ccd7ce;border-radius:8px}button{border:0;border-radius:9px;padding:11px 16px;background:#17643b;color:#fff;cursor:pointer;font-weight:650;margin:4px;transition:background .15s ease,transform .15s ease}button:hover{background:#124d2e}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9ac9a8;outline-offset:2px}button.secondary{background:#e9f1eb;color:#174d32}button:disabled{opacity:.45;cursor:not-allowed}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stat{background:#edf5ee;padding:16px;border-radius:10px}.stat strong{display:block;font-size:26px;margin-top:7px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button.active{background:#174d32}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:12px;text-align:left;border-bottom:1px solid #e4e9e4;vertical-align:top}th{background:#f5f8f4;font-size:13px;letter-spacing:.02em;white-space:nowrap}.muted{color:#68766d;font-size:13px}#message,#status{margin-top:12px;color:#9a3328}.status-good{color:#17643b!important}.actions{white-space:nowrap}.modal{position:fixed;inset:0;background:#10201699;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}.modal-box{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:85vh;overflow:auto;padding:22px}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.detail{padding:10px;background:#f5f8f4;border-radius:8px;overflow-wrap:anywhere}.detail b{display:block;font-size:12px;color:#68766d;margin-bottom:5px}.pager{margin-top:14px}@media(max-width:650px){.stats{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}header{padding:18px}}
.api-settings{margin:12px 0 18px;padding:14px;border:1px solid #dce8de;background:#f7faf7;border-radius:12px}.api-settings label{display:block;font-weight:700;font-size:13px}.api-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.api-row input{flex:1;min-width:220px;max-width:none;margin:8px 0}.api-settings small{display:block;color:#65756a}.api-settings #apiStatus{margin-top:5px}.api-settings #apiStatus.good{color:#17643b}.api-settings #apiStatus.bad{color:#a83228}@media(max-width:650px){.api-row button{flex:1}.api-row input{min-width:100%}}
</style>
</head>
<body>
<header><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h2> Khushhal Kisan | <span data-en="Admin Panel">Admin Panel</span></h2><select id="adminLanguage" aria-label="Admin language" style="padding:9px;border-radius:8px"><option value="hi">हिन्दी</option><option value="en">English</option><option value="as">অসমীয়া</option></select></div></header>
<main>
<section class="card" id="login">
<h2 data-en='Admin Login'>Admin Login</h2>
<div class="api-settings">
<label for="apiBaseUrl">API Server URL</label>
<div class="api-row"><input id="apiBaseUrl" type="url" placeholder="https://your-api.onrender.com"><button type="button" class="secondary" id="saveApiUrl">Save API</button><button type="button" id="testApiUrl">Test Connection</button></div>
<small id="apiStatus">Set the deployed API URL if the dashboard cannot fetch records.</small>
</div>
<form id="loginForm">
<input id="username" autocomplete="username" placeholder="Admin Username" required>
<input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
<button type="submit" data-en="Login">Login</button>
</form><div id="message"></div>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<h2 data-en='Survey Dashboard'>Survey Dashboard</h2>
<div class="stats">
<div class="stat"><span data-en='Submitted Surveys'>Submitted Surveys</span><strong id="submitted">0</strong></div>
<div class="stat"><span data-en='New Version Surveys'>New Version Surveys</span><strong id="newSubmitted">0</strong></div>
<div class="stat"><span data-en='Historical Surveys'>Historical Surveys</span><strong id="oldSubmitted">0</strong></div>
<div class="stat"><span data-en='Farmer Surveys'>Farmer Surveys</span><strong id="farmers">0</strong></div>
<div class="stat"><span data-en='FPO Surveys'>FPO Surveys</span><strong id="stakeholders">0</strong></div>
<div class="stat"><span data-en='Pending Farmer'>Pending Farmer</span><strong id="pendingFarmers">0</strong></div>
<div class="stat"><span data-en='Pending FPO'>Pending FPO</span><strong id="pendingStakeholders">0</strong></div>
<div class="stat"><span data-en='Total Pending'>Total Pending</span><strong id="enquiries">0</strong></div>
</div>
<div class="tabs">
<button id="farmerTab" class="active" onclick="switchTab('farmer')" data-en='Farmer Surveys'>Farmer Surveys</button>
<button id="stakeholderTab" class="secondary" onclick="switchTab('stakeholder')" data-en='FPO Surveys'>FPO Surveys</button>
<button id="pendingFarmerTab" class="secondary" onclick="switchTab('pending_farmer')" data-en='Pending Farmer'>Pending Farmer</button>
<button id="pendingStakeholderTab" class="secondary" onclick="switchTab('pending_stakeholder')" data-en='Pending FPO'>Pending FPO</button>
</div>
<button class="secondary" onclick="loadRecords()" data-en='Refresh'>Refresh</button>
<button onclick="downloadExcel()" data-en='Download All 4 Sheets'>Download All 4 Sheets</button>
<button class="secondary" onclick="downloadPendingExcel()" data-en='Download Pending Drafts'>Download Pending Drafts</button>
<button class="secondary" onclick="logout()" data-en='Logout'>Logout</button>
<p id="status"></p>
</div>

<div class="card">
<h3 id="listTitle">Submitted Surveys</h3>
<div class="table-wrap">
<table>
<thead id="tableHead"></thead>
<tbody id="records"></tbody>
</table>
</div>
<div id="recordPagination" class="pager"></div>
</div>
</section>
</main>

<div id="detailsModal" class="modal hidden" role="dialog" aria-modal="true">
 <div class="modal-box">
  <div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
   <h3 id="modalTitle">Details</h3><button class="secondary" onclick="closeDetails()" data-en="Close">Close</button>
  </div>
  <div id="detailContent" class="detail-grid"></div>
 </div>
</div>

<script>
let API=(localStorage.getItem('kk_admin_api_url')||window.KK_API_URL||(location.hostname==='localhost'||location.hostname==='127.0.0.1'?'http://localhost:5000':'https://khushhal-kisan-api.onrender.com')).replace(/\/$/,'');
let token=sessionStorage.getItem('kk_admin_token')||'';
let currentTab='farmer',currentOffset=0,uiLang=localStorage.getItem('kk_admin_language')||'hi';
const pageSize=50;
const $=id=>document.getElementById(id);
$('apiBaseUrl').value=API;
const apiStatus=(message,ok)=>{$('apiStatus').textContent=message;$('apiStatus').className=ok?'good':'bad';};
$('saveApiUrl').addEventListener('click',()=>{
 const value=$('apiBaseUrl').value.trim().replace(/\/$/,'');
 if(!/^https?:\/\//i.test(value)){apiStatus('Enter a valid URL beginning with https:// or http://',false);return;}
 API=value;localStorage.setItem('kk_admin_api_url',API);apiStatus('API URL saved. You can now log in or refresh records.',true);
});
$('testApiUrl').addEventListener('click',async()=>{
 const value=$('apiBaseUrl').value.trim().replace(/\/$/,'');
 if(!/^https?:\/\//i.test(value)){apiStatus('Enter a valid API URL first.',false);return;}
 apiStatus('Testing API and database connection�',true);
 try{const response=await fetch(value+'/api/health');const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.message||data.database||'API health check failed');apiStatus('Connected successfully. Database: '+(data.database||'connected'),true);}
 catch(error){apiStatus('Connection failed: '+error.message+' � check API URL, server status and CLIENT_ORIGIN.',false);}
});

function t(value){
 if(uiLang==='en') return value;
 const pair=translations[value];
 const localized=pair ? pair[uiLang==='as'?1:0] : '';
 return localized && !/[?�]/.test(localized) ? localized : value;
}
function applyLanguage(){document.querySelectorAll('[data-en]').forEach(el=>el.textContent=t(el.getAttribute('data-en')));$('username').placeholder=t('Admin Username');$('password').placeholder=t('Password');}
$('adminLanguage').value=uiLang;$('adminLanguage').addEventListener('change',e=>{uiLang=e.target.value;localStorage.setItem('kk_admin_language',uiLang);applyLanguage();if(token)loadRecords();});

const esc=value=>String(value??'');
function setMessage(text,good=false){$('status').textContent=t(text);$('status').className=good?'status-good':'';}

$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();$('message').textContent=t('Logging in...');
 try{
  const r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});
  const d=await r.json();if(!r.ok)throw new Error(d.message||'Login failed');
  token=d.token;sessionStorage.setItem('kk_admin_token',token);
  $('login').classList.add('hidden');$('dashboard').classList.remove('hidden');loadRecords();
 }catch(err){$('message').textContent=t(err.message);}
});

function switchTab(tab){
  if (!['farmer','stakeholder','pending_farmer','pending_stakeholder'].includes(tab)) return;
  currentTab = tab;
  currentOffset = 0;
  for (const name of ['farmer','stakeholder','pending_farmer','pending_stakeholder']) {
    const button = $(name === 'pending_farmer' ? 'pendingFarmerTab' :
      name === 'pending_stakeholder' ? 'pendingStakeholderTab' : name + 'Tab');
    button.classList.toggle('active', tab === name);
    button.classList.toggle('secondary', tab !== name);
  }
  const titles = {
    farmer:'Farmer Surveys',
    stakeholder:'FPO Surveys',
    pending_farmer:'Pending Farmer',
    pending_stakeholder:'Pending FPO'
  };
  $('listTitle').textContent = t(titles[tab]);
  loadRecords();
}

async function loadRecords(){
  setMessage(t('Loading...'));

  try {
    const isPending = currentTab.startsWith('pending_');
    const pendingType = currentTab === 'pending_stakeholder' ? 'stakeholder' : 'farmer';
    const endpoint = isPending
      ? '/api/admin/enquiries?type=' + pendingType
      : '/api/admin/surveys?type=' + encodeURIComponent(currentTab);

    const separator = endpoint.includes('?') ? '&' : '?';
    const r = await fetch(
      API + endpoint + separator + 'limit=' + pageSize + '&offset=' + currentOffset,
      { headers: { Authorization: 'Bearer ' + token } }
    );

    const d = await r.json();
    if (!r.ok) throw new Error(d.message || 'Could not load records');

    const sr = await fetch(API + '/api/admin/dashboard', {
      headers: { Authorization: 'Bearer ' + token }
    });
    const sd = await sr.json();
    if (!sr.ok) throw new Error(sd.message || 'Could not load dashboard');

    const summary = sd.summary || {};
    $('submitted').textContent = summary.total_submitted ?? 0;
    $('newSubmitted').textContent = summary.new_submitted ?? 0;
    $('oldSubmitted').textContent = summary.old_submitted ?? 0;
    $('farmers').textContent = summary.farmer_surveys ?? 0;
    $('stakeholders').textContent = summary.stakeholder_surveys ?? 0;
    $('pendingFarmers').textContent = summary.pending_farmer ?? 0;
    $('pendingStakeholders').textContent = summary.pending_stakeholder ?? 0;
    $('enquiries').textContent = summary.total_pending ?? summary.total_enquiries ?? 0;

    const rows = isPending
      ? (d.pending || d.enquiries || [])
      : (d.surveys || []);

    const headings = isPending
      ? ['Pending ID','Name','Mobile','Village / Location','Last Updated','Details']
      : ['Survey ID','Name','Mobile','Type','Submitted','Details'];

    $('tableHead').replaceChildren();
    const headerRow = document.createElement('tr');

    headings.forEach(heading => {
      const th = document.createElement('th');
      th.textContent = t(heading);
      headerRow.append(th);
    });

    $('tableHead').append(headerRow);
    $('records').replaceChildren();

    if (!rows.length) {
      const emptyRow = document.createElement('tr');
      const emptyCell = document.createElement('td');
      emptyCell.colSpan = headings.length;
      emptyCell.className = 'muted';
      emptyCell.textContent = t('No records found.');
      emptyRow.append(emptyCell);
      $('records').append(emptyRow);
    }

    rows.forEach(record => {
      const tr = document.createElement('tr');
      const name = record.answers?.name || record.name || '';
      const mobile = record.answers?.mobile || record.mobile || '';
      const location = record.answers?.location || record.answers?.address || record.answers?.fpo_district || record.location || '';
      const dateValue = isPending
        ? (record.updated_at || record.created_at)
        : (record.submitted_at || record.created_at);

      const dateText = dateValue
        ? new Date(dateValue).toLocaleString('en-IN')
        : '';

      const values = isPending
        ? [record.response_id, name, mobile, location, dateText]
        : [
            record.response_id,
            name,
            mobile,
            t(record.survey_type || currentTab),
            dateText
          ];

      values.forEach(value => {
        const td = document.createElement('td');
        td.textContent = String(value ?? '');
        tr.append(td);
      });

      const action = document.createElement('td');
      action.className = 'actions';

      const view = document.createElement('button');
      view.textContent = t('View Details');
      view.onclick = () => showDetails(record);

      action.append(view);
      tr.append(action);
      $('records').append(tr);
    });

    $('recordPagination').replaceChildren();

    const prev = document.createElement('button');
    prev.textContent = t('Previous');
    prev.className = 'secondary';
    prev.disabled = currentOffset === 0;
    prev.onclick = () => {
      currentOffset = Math.max(0, currentOffset - pageSize);
      loadRecords();
    };

    const next = document.createElement('button');
    next.textContent = t('Next');
    next.className = 'secondary';
    next.disabled = currentOffset + pageSize >= d.total;
    next.onclick = () => {
      currentOffset += pageSize;
      loadRecords();
    };

    $('recordPagination').append(prev, next);

    const category = currentTab === 'farmer'
      ? 'Farmer Surveys'
      : currentTab === 'stakeholder'
        ? 'FPO Surveys'
        : currentTab === 'pending_farmer'
          ? 'Pending Farmer'
          : 'Pending FPO';

    setMessage(
      t('Showing') + ' ' +
      (rows.length ? currentOffset + 1 : 0) + '-' +
      (currentOffset + rows.length) + ' ' +
      t('of') + ' ' + d.total + ' ' + t(category) + '.',
      true
    );
  } catch (err) {
    setMessage(err.message);
  }
}

function showDetails(record){
  const pending = currentTab.startsWith('pending_');
  $('modalTitle').textContent =
    t(pending ? 'Pending' : 'Survey') + ' · ' +
    (record.response_id || '');

  const answers = record.answers && typeof record.answers === 'object'
    ? record.answers
    : {};

  const details = {
    [t(pending ? 'Pending ID' : 'Survey ID')]: record.response_id,
    [t('Questionnaire Version')]: t(record.survey_version || 'legacy'),
    [t('Record Status')]: t(record.status || ''),
    [t('Survey Type')]: t(record.survey_type || ''),
    [t('Language')]: record.language || '',
    [t('Created At')]: record.created_at
      ? new Date(record.created_at).toLocaleString('en-IN')
      : '',
    [t('Submitted At')]: record.submitted_at
      ? new Date(record.submitted_at).toLocaleString('en-IN')
      : t('Not submitted'),
    ...Object.fromEntries(
      Object.entries(answers).map(([key, value]) => [t(key) === key ? key.replaceAll('_', ' ') : t(key), value])
    )
  };

  $('detailContent').replaceChildren();

  Object.entries(details).forEach(([key, value]) => {
    const item = document.createElement('div');
    item.className = 'detail';

    const label = document.createElement('b');
    label.textContent = key;

    const content = document.createElement('span');
    if (value && typeof value === 'object' && value.dataUrl) {
      const preview = document.createElement('img');
      preview.src = value.dataUrl;
      preview.alt = value.fileName || 'Survey photo';
      preview.style.cssText = 'display:block;max-width:220px;max-height:180px;object-fit:contain;margin-top:6px;border-radius:8px';
      content.textContent = value.fileName || 'Uploaded photo';
      content.append(preview);
    } else {
      content.textContent = Array.isArray(value)
        ? value.join(', ')
        : (value && typeof value === 'object'
            ? JSON.stringify(value)
            : String(value ?? ''));
    }

    item.append(label, content);
    $('detailContent').append(item);
  });

  $('detailsModal').classList.remove('hidden');
}
function closeDetails(){$('detailsModal').classList.add('hidden');}
$('detailsModal').addEventListener('click',e=>{if(e.target===$('detailsModal'))closeDetails();});

async function downloadExcel(){
  setMessage(t('Preparing Excel...'));

  try {
    const r = await fetch(
      API + '/api/admin/export-excel?type=' +
      encodeURIComponent(currentTab) + '&lang=' + encodeURIComponent(uiLang),
      { headers: { Authorization: 'Bearer ' + token } }
    );

    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.message || 'Excel export failed');
    }

    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');

    a.href = url;
    a.download = 'Khushhal_Kisan_All_4_Survey_Sheets.xlsx';

    document.body.append(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    setMessage(t('All four sheets downloaded successfully.'), true);
  } catch (err) {
    setMessage(err.message);
  }
}

async function downloadPendingExcel(){
  setMessage(t('Preparing Excel...'));
  try{
    const r=await fetch(API+'/api/admin/export-pending-excel',{headers:{Authorization:'Bearer '+token}});
    if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.message||'Pending Excel export failed');}
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='Khushhal_Kisan_Pending_Drafts.xlsx';
    document.body.append(a);a.click();a.remove();
    URL.revokeObjectURL(url);
    setMessage(t('Pending drafts downloaded successfully.'),true);
  }catch(err){setMessage(err.message);}
}
